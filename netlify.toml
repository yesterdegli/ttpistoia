[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Tailwind, TypeScript ed ESLint sono devDependencies — servono al build
  NPM_CONFIG_PRODUCTION = "false"
  #
  # SEO / go-live su ttpistoia.it (impostare in Netlify → Environment variables → Production):
  #   NEXT_PUBLIC_SITE_URL = https://www.ttpistoia.it
  #   NEXT_PUBLIC_ALLOW_INDEX = false   ← fino al puntamento DNS
  #   NEXT_PUBLIC_ALLOW_INDEX = true    ← il giorno del cutover (poi redeploy)
  #
  # Dopo il cutover: Search Console → inviare https://www.ttpistoia.it/sitemap.xml

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Canonical host (www + HTTPS)
[[redirects]]
  from = "http://ttpistoia.it/*"
  to = "https://www.ttpistoia.it/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://ttpistoia.it/*"
  to = "https://www.ttpistoia.it/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.ttpistoia.it/*"
